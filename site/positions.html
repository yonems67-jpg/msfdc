<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>持仓录入 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">持仓录入</h2>
    <p class="page-note">手动登记实际成交。影子模式只记录，不计入持仓与仓位。</p>
  </div>

  <section class="card">
    <h3 class="card-title">新增记录</h3>
    <div class="form-grid">
      <label class="fld"><span>股票代码</span>
        <input id="f-code" inputmode="numeric" maxlength="6" placeholder="600000" /></label>
      <label class="fld"><span>名称（可选）</span>
        <input id="f-name" placeholder="可留空" /></label>
      <label class="fld"><span>方向</span>
        <select id="f-side"><option value="buy">买入</option><option value="sell">卖出</option></select></label>
      <label class="fld"><span>成交价</span>
        <input id="f-price" inputmode="decimal" placeholder="12.34" /></label>
      <label class="fld"><span>股数</span>
        <input id="f-shares" inputmode="numeric" placeholder="100" /></label>
      <label class="fld"><span>成交日期</span>
        <input id="f-date" type="date" /></label>
      <label class="fld"><span>模式</span>
        <select id="f-mode">
          <option value="shadow">影子记录</option>
          <option value="real">真实成交</option>
        </select></label>
      <label class="fld"><span>备注</span>
        <input id="f-note" placeholder="可选" /></label>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="btn-submit">提交</button>
      <button class="btn" id="btn-clear">清空</button>
      <span class="form-msg" id="msg"></span>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">已登记记录</h3>
      <span class="section-meta" id="log-meta">—</span>
    </div>
    <div class="card" id="log"></div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
const ENDPOINT = "https://position-zjrormarem.cn-hangzhou.fcapp.run";

function setMsg(text, kind) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "form-msg" + (kind ? " is-" + kind : "");
}
function val(id) { return (document.getElementById(id).value || "").trim(); }

function validate() {
  if (!/^\d{6}$/.test(val("f-code"))) return "股票代码需为 6 位数字";
  const px = parseFloat(val("f-price"));
  if (!isFinite(px) || px <= 0) return "成交价无效";
  const sh = parseInt(val("f-shares"), 10);
  if (!isFinite(sh) || sh <= 0) return "股数无效";
  if (sh % 100 !== 0) return "股数需为 100 的整数倍";
  if (!val("f-date")) return "请选择成交日期";
  return null;
}

async function submit() {
  const err = validate();
  if (err) { setMsg(err, "err"); return; }

  const payload = {
    code: val("f-code"),
    name: val("f-name") || null,
    side: val("f-side"),
    price: parseFloat(val("f-price")),
    shares: parseInt(val("f-shares"), 10),
    trade_date: val("f-date"),
    mode: val("f-mode"),
    note: val("f-note") || null,
    submitted_at: new Date().toISOString(),
  };

  setMsg("提交中…", "");
  document.getElementById("btn-submit").disabled = true;
  try {
    const r = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const txt = await r.text();
    if (r.ok) {
      setMsg("已提交 · " + txt.slice(0, 80), "ok");
      ["f-code", "f-name", "f-price", "f-shares", "f-note"].forEach(i =>
        document.getElementById(i).value = "");
    } else {
      setMsg("失败 " + r.status + " · " + txt.slice(0, 120), "err");
    }
  } catch (e) {
    setMsg("网络错误：" + String(e).slice(0, 120), "err");
  } finally {
    document.getElementById("btn-submit").disabled = false;
  }
}

(async function () {
  buildChrome("positions.html");
  stampLastRun();

  document.getElementById("f-date").value = new Date().toISOString().slice(0, 10);
  document.getElementById("btn-submit").addEventListener("click", submit);
  document.getElementById("btn-clear").addEventListener("click", () => {
    ["f-code", "f-name", "f-price", "f-shares", "f-note"].forEach(i =>
      document.getElementById(i).value = "");
    setMsg("", "");
  });

  const data = await loadJson("position_log.json");
  const list = Array.isArray(data) ? data : (data && (data.records || data.log)) || [];

  panel("记录列表", () => {
    document.getElementById("log-meta").textContent =
      list.length ? `${list.length} 条` : "无";
    if (!list.length) {
      document.getElementById("log").innerHTML =
        emptyState("尚无记录", "提交后由 FC 写入 position_log.json");
      return;
    }
    const rows = list.slice().reverse().slice(0, 100).map(r =>
      `<tr>
        <td>${esc(r.trade_date || r.date || "")}</td>
        <td class="num">${esc(r.code || "")}</td>
        <td>${esc(r.name || "")}</td>
        <td><span class="tag ${r.side === "sell" ? "tag-warn" : "tag-ok"}">
          ${r.side === "sell" ? "卖出" : "买入"}</span></td>
        <td class="num">${fmt.num(r.price, 2)}</td>
        <td class="num">${fmt.num(r.shares, 0)}</td>
        <td><span class="tag tag-muted">${r.mode === "real" ? "真实" : "影子"}</span></td>
        <td class="dim">${esc(r.note || "")}</td>
      </tr>`).join("");
    document.getElementById("log").innerHTML = `
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>日期</th><th class="num">代码</th><th>名称</th><th>方向</th>
          <th class="num">价格</th><th class="num">股数</th><th>模式</th><th>备注</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  });
})();
</script>

<style>
.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
.fld { display:flex; flex-direction:column; gap:5px; font-size:.9em; }
.fld span { opacity:.7; }
.fld input, .fld select { padding:8px 10px; border:1px solid var(--rule,#d8d4cc);
  border-radius:6px; background:transparent; color:inherit; font:inherit; }
.form-actions { display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
.btn { padding:8px 16px; border:1px solid var(--rule,#d8d4cc); border-radius:6px;
  background:transparent; color:inherit; font:inherit; cursor:pointer; }
.btn-primary { border-color:var(--accent,#3d7a5a); }
.btn:disabled { opacity:.5; cursor:default; }
.form-msg { font-size:.9em; opacity:.8; }
.form-msg.is-ok { color:var(--pos,#3d7a5a); }
.form-msg.is-err { color:var(--neg,#b4483c); }
.tbl td.num, .tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
.tbl td.dim { opacity:.65; font-size:.9em; }
.table-wrap { overflow-x:auto; }
</style>
</body>
</html>
