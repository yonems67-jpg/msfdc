<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>板块与选股 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">板块与选股</h2>
  </div>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">领涨板块 TOP5</h3>
      <span class="section-meta" id="top5-meta">—</span>
    </div>
    <div id="top5-list"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">板块评分</h3>
      <span class="section-meta" id="sector-meta">—</span>
    </div>
    <div id="sectors"></div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
function n_(o, keys) {
  if (!o) return null;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return null;
}
function s_(o, keys, d) {
  if (!o) return d || "";
  for (const k of keys) {
    const v = o[k];
    if (v !== undefined && v !== null && v !== "") return String(v);
  }
  return d || "";
}

function top5Card(s, rank) {
  const leaderName = s_(s, ["领涨股", "leader_name", "leader"]);
  const leaderChg = n_(s, ["领涨股-涨跌幅", "leader_chg"]);
  const chg = n_(s, ["涨跌幅", "chg"]);
  const netIn = n_(s, ["净流入", "net_inflow"]);
  return `<div class="card">
    <div class="stock-head">
      <div><span class="rank-badge">${rank}</span>
        <span class="stock-name">${esc(s_(s, ["板块", "sector"], "—"))}</span></div>
      <span class="tag ${chg>0?"tag-ok":"tag-warn"}">${chg!==null?(chg>0?"+":"")+fmt.num(chg,2)+"%":"—"}</span>
    </div>
    <div class="kv-list">
      ${netIn!==null?`<div class="kv-row"><span class="kv-key">净流入</span>
        <span class="kv-val num ${netIn>0?"pos":"neg"}">${fmt.num(netIn,2)} 亿</span></div>`:""}
      <div class="kv-row"><span class="kv-key">龙头股</span>
        <span class="kv-val">${esc(leaderName||"—")}</span></div>
      ${leaderChg!==null?`<div class="kv-row"><span class="kv-key">龙头涨跌幅</span>
        <span class="kv-val num ${leaderChg>0?"pos":"neg"}">${leaderChg>0?"+":""}${fmt.num(leaderChg,2)}%</span></div>`:""}
    </div>
  </div>`;
}

function sectorCard(s, rank) {
  const d = s.detail || {};
  const rows = Object.keys(d).map(k =>
    `<div class="kv-row"><span class="kv-key">${esc(k)}</span>
     <span class="kv-val num">${fmt.num(d[k], 1)}</span></div>`).join("");
  return `<div class="card">
    <div class="stock-head">
      <div><span class="rank-badge">${rank}</span>
        <span class="stock-name">${esc(s.sector || "—")}</span></div>
      <span class="tag tag-muted">${fmt.num(s.score, 1)} 分</span>
    </div>
    <div class="kv-list">${rows}</div>
  </div>`;
}

(async function () {
  buildChrome("sectors.html");
  stampLastRun();

  const [sectorRank, secRaw] = await Promise.all([
    loadJson("sector_rank.json"),
    loadJson("sectors.json"),
  ]);

  panel("领涨板块", () => {
    let list = Array.isArray(sectorRank) ? sectorRank : (sectorRank && (sectorRank.sectors || sectorRank.top_sectors)) || [];
    list = list.slice(0, 5);
    document.getElementById("top5-meta").textContent = list.length ? `${list.length} 个` : "无数据";
    document.getElementById("top5-list").innerHTML = list.length
      ? `<div class="grid cols-2">${list.map((s,i)=>top5Card(s,i+1)).join("")}</div>`
      : emptyState("暂无板块数据", "");
  });

  panel("板块评分", () => {
    let list = [];
    if (Array.isArray(secRaw)) list = secRaw;
    else if (secRaw) list = secRaw.sectors || secRaw.top_sectors || [];
    document.getElementById("sector-meta").textContent = list.length ? `${list.length} 个` : "无数据";
    document.getElementById("sectors").innerHTML = list.length
      ? `<div class="grid cols-2">${list.map((s, i) => sectorCard(s, i + 1)).join("")}</div>`
      : emptyState("暂无板块数据", "");
  });
})();
</script>

<style>
.rank-badge { display:inline-block; min-width:1.6em; text-align:center;
  font-variant-numeric:tabular-nums; opacity:.55; margin-right:6px; }
.stock-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
.stock-name { margin-left:0; opacity:.9; font-weight:600; }
.kv-row { display:flex; justify-content:space-between; gap:12px; padding:3px 0; align-items:baseline; }
.kv-key { opacity:.7; flex-shrink:0; font-size:.92em; }
.kv-val.num { font-variant-numeric:tabular-nums; }
.kv-val.pos { color:var(--pos,#3d7a5a); }
.kv-val.neg { color:var(--neg,#b4483c); }
</style>
</body>
</html>
