<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>建仓候选 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">建仓候选</h2>
  </div>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">综合打分 TOP20</h3>
      <span class="section-meta" id="list-meta">—</span>
    </div>
    <div class="table-wrap">
      <table class="tbl" id="rank-table">
        <thead>
          <tr>
            <th>排名</th><th>代码</th><th>名称</th>
            <th class="num">最新价</th><th class="num">历史最高价</th>
            <th>行业</th><th class="num">综合得分</th>
          </tr>
        </thead>
        <tbody id="rank-body"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
function n_(o, keys) {
  if (!o) return null;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return null;
}
function s_(o, keys, d) {
  if (!o) return d || "";
  for (const k of keys) {
    const v = o[k];
    if (v !== undefined && v !== null && v !== "") return String(v);
  }
  return d || "";
}

function row(s, rank) {
  const price = n_(s, ["最新价"]);
  const hi = n_(s, ["历史最高价", "hist_high"]);
  const score = n_(s, ["综合得分", "score"]);
  return `<tr>
    <td class="num">${rank}</td>
    <td class="num">${esc(s_(s, ["代码"]))}</td>
    <td>${esc(s_(s, ["名称"]))}</td>
    <td class="num">${price!==null?fmt.num(price,2):"—"}</td>
    <td class="num">${hi!==null?fmt.num(hi,2):"—"}</td>
    <td>${esc(s_(s, ["行业"], "未分类"))}</td>
    <td class="num">${score!==null?fmt.num(score,1):"—"}</td>
  </tr>`;
}

(async function () {
  buildChrome("signals.html");
  stampLastRun();

  const dual = await loadJson("dual.json");
  const A = (dual && dual.momentum) || {};
  let stocks = A.stocks || [];

  // 按综合得分降序；无得分字段时退化为原有顺序
  stocks = stocks.slice().sort((a, b) => {
    const sa = n_(a, ["综合得分", "score"]) ?? -1;
    const sb = n_(b, ["综合得分", "score"]) ?? -1;
    return sb - sa;
  }).slice(0, 20);

  panel("列表", () => {
    document.getElementById("list-meta").textContent = stocks.length
      ? `${stocks.length} 只 · ${(dual && dual.update_date) || ""}` : "无";
    document.getElementById("rank-body").innerHTML = stocks.length
      ? stocks.map((s, i) => row(s, i + 1)).join("")
      : `<tr><td colspan="7">${emptyState("今日无候选", A.fallback_status?.fallback_note || "")}</td></tr>`;
  });
})();
</script>

<style>
.table-wrap { overflow-x:auto; }
.tbl td.num, .tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</body>
</html>
