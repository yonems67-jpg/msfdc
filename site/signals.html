<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>信号与风险 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">信号与风险</h2>
    <p class="page-note">
      低成交额策略，持有 60 个交易日到期换仓。
      风险分档由期望值排位与极端档数量共同决定，高风险仅观察不建仓。
    </p>
  </div>

  <section class="grid cols-3" id="overview"></section>
  <section id="alerts"></section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">建仓候选</h3>
      <span class="section-meta" id="buy-meta">—</span>
    </div>
    <div id="buy-list"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">高风险 · 仅观察</h3>
      <span class="section-meta" id="watch-meta">—</span>
    </div>
    <div id="watch-list"></div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
const BASE_POS = 2.0;   // 基准单票仓位 %

const RISK = {
  low:  { label: "低风险", cls: "tag-ok",   mult: 1.0,  note: "基准仓位" },
  mid:  { label: "中风险", cls: "tag-muted", mult: 0.7, note: "基准 × 0.7" },
  high: { label: "高风险", cls: "tag-warn",  mult: 0,   note: "仅观察" },
};

function n_(o, keys, d) {
  if (!o) return d === undefined ? null : d;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return d === undefined ? null : d;
}
function s_(o, keys, d) {
  if (!o) return d || "";
  for (const k of keys) {
    const v = o[k];
    if (v !== undefined && v !== null && v !== "") return String(v);
  }
  return d || "";
}
function row(label, val, digits, suffix, colorize) {
  if (val === null || val === undefined) return "";
  const cls = colorize ? (val > 0 ? "pos" : val < 0 ? "neg" : "") : "";
  return `<div class="kv-row"><span class="kv-key">${label}</span>
    <span class="kv-val num ${cls}">${fmt.num(val, digits)}${suffix || ""}</span></div>`;
}

/**
 * 风险分档：
 *   低  期望值排前 1/3 且无变量落最差档
 *   中  排中 1/3，或恰好 1 个变量落最差档
 *   高  排后 1/3，或 2 个以上落最差档
 */
function assignRisk(list) {
  const n = list.length;
  const sorted = list.slice().sort((a, b) =>
    n_(b, ["expect_bps", "stock_score"], 0) - n_(a, ["expect_bps", "stock_score"], 0));
  const rankOf = new Map();
  sorted.forEach((s, i) => rankOf.set(s, i));

  return list.map(s => {
    const r = rankOf.get(s);
    const worst = n_(s, ["n_worst"], 0) || 0;
    let lvl;
    if (worst >= 2) lvl = "high";
    else if (worst === 1) lvl = "mid";
    else if (r < n / 3) lvl = "low";
    else if (r < n * 2 / 3) lvl = "mid";
    else lvl = "high";
    return { s, lvl, rank: r };
  });
}

function card(item) {
  const { s, lvl } = item;
  const R = RISK[lvl];
  const amt = n_(s, ["core_amt"]);
  const mv = n_(s, ["mv"]);
  const pos = R.mult > 0 ? BASE_POS * R.mult : null;
  return `<div class="card risk-${lvl}">
    <div class="stock-head">
      <div><span class="stock-code">${esc(s_(s, ["code", "代码"]))}</span>
        <span class="stock-name">${esc(s_(s, ["name", "名称"]))}</span></div>
      <span class="tag ${R.cls}">${R.label}</span>
    </div>
    <div class="kv-list">
      ${row("最新价", n_(s, ["close"]), 2)}
      ${row("涨跌幅", n_(s, ["chg"]) !== null ? s.chg * 100 : null, 2, "%", true)}
      ${amt !== null ? `<div class="kv-row"><span class="kv-key">60日均成交额</span>
        <span class="kv-val num">${fmt.num(amt / 1e8, 3)} 亿</span></div>` : ""}
      ${mv !== null ? `<div class="kv-row"><span class="kv-key">流通市值</span>
        <span class="kv-val num">${fmt.num(mv / 1e8, 1)} 亿</span></div>` : ""}
      ${row("换手率", n_(s, ["turn"]) !== null ? s.turn * 100 : null, 2, "%")}
      ${row("20日涨幅", n_(s, ["ret20"]) !== null ? s.ret20 * 100 : null, 1, "%", true)}
      ${s.sector && s.sector !== "未分类" ? `<div class="kv-row"><span class="kv-key">行业</span>
        <span class="kv-val">${esc(s.sector)}</span></div>` : ""}
      <div class="kv-row"><span class="kv-key">建议仓位</span>
        <span class="kv-val">${pos !== null ? fmt.num(pos, 1) + "%" : R.note}</span></div>
    </div>
  </div>`;
}

function alertBox(t) {
  return `<div class="card alert"><p style="margin:0">${t}</p></div>`;
}

(async function () {
  buildChrome("signals.html");
  stampLastRun();

  const dual = await loadJson("dual.json");
  const B = (dual && dual.low_turnover) || {};
  const all = B.buy || [];
  const meta = B.meta || {};

  if (!dual) {
    document.getElementById("buy-list").innerHTML =
      emptyState("尚无信号", "等定时任务运行完成后，这里会显示当日候选");
    return;
  }

  const ranked = assignRisk(all);
  const buy = ranked.filter(x => x.lvl !== "high")
    .sort((a, b) => a.rank - b.rank);
  const watch = ranked.filter(x => x.lvl === "high")
    .sort((a, b) => a.rank - b.rank);

  panel("概览", () => {
    const cnt = { low: 0, mid: 0, high: 0 };
    ranked.forEach(x => cnt[x.lvl]++);
    const cards = [
      ["低风险", cnt.low, "tag-ok"],
      ["中风险", cnt.mid, "tag-muted"],
      ["高风险", cnt.high, "tag-warn"],
    ];
    document.getElementById("overview").innerHTML = cards.map(c =>
      `<div class="card"><h3 class="card-title">${esc(c[0])}
        <span class="tag ${c[2]}">${c[1]} 只</span></h3>
       <div class="big-num">${c[1]}</div></div>`).join("");
  });

  panel("警示", () => {
    const box = [];
    if (all.length && all.length < 30) {
      box.push(alertBox(
        `候选仅 <strong>${all.length}</strong> 只，分散度不足。
         该策略的超额来自整层股票的平均效应，个股波动远大于因子差异，
         需 50 只以上持仓才能实现。`));
    }
    if (meta.amt_source === "today_proxy" || meta.bootstrapping) {
      box.push(alertBox(
        `主因子当前使用<strong>当日成交额代理 60 日均额</strong>，
         滚动缓存满 60 个交易日后自动切换到真实值。此期间建议只做记录。`));
    }
    if (B.error) box.push(alertBox(`策略运行失败：${esc(B.error)}`));
    document.getElementById("alerts").innerHTML = box.join("");
  });

  panel("建仓候选", () => {
    document.getElementById("buy-meta").textContent =
      buy.length ? `${buy.length} 只 · 持有 60 个交易日` : "无";
    document.getElementById("buy-list").innerHTML = buy.length
      ? `<div class="grid cols-2">${buy.map(card).join("")}</div>`
      : emptyState("今日无建仓候选", "所有标的被硬性剔除或落入高风险档");
  });

  panel("高风险", () => {
    document.getElementById("watch-meta").textContent =
      watch.length ? `${watch.length} 只 · 不建仓` : "无";
    document.getElementById("watch-list").innerHTML = watch.length
      ? `<div class="grid cols-2">${watch.map(card).join("")}</div>`
      : emptyState("无高风险标的", "");
  });
})();
</script>

<style>
.big-num { font-size:1.9rem; font-variant-numeric:tabular-nums; line-height:1.15; }
.stock-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
.stock-code { font-variant-numeric:tabular-nums; font-weight:600; }
.stock-name { margin-left:8px; opacity:.8; }
.kv-row { display:flex; justify-content:space-between; gap:12px; padding:3px 0; align-items:baseline; }
.kv-key { opacity:.7; flex-shrink:0; font-size:.92em; }
.kv-val { text-align:right; }
.kv-val.num { font-variant-numeric:tabular-nums; }
.kv-val.pos { color:var(--pos,#3d7a5a); }
.kv-val.neg { color:var(--neg,#b4483c); }
.card.risk-low { border-left:3px solid var(--pos,#3d7a5a); }
.card.risk-mid { border-left:3px solid var(--rule,#d8d4cc); }
.card.risk-high { border-left:3px solid var(--warn,#b8862a); }
.alert { border-left:3px solid var(--warn,#b8862a); }
</style>
</body>
</html>
