<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>建仓候选 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">建仓候选</h2>
  </div>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">动量选股</h3>
      <span class="section-meta" id="mom-meta">—</span>
    </div>
    <div id="mom-list"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">60日低成交额策略 TOP20</h3>
      <span class="section-meta" id="lt-meta">—</span>
    </div>
    <div class="table-wrap">
      <table class="tbl" id="lt-table">
        <thead>
          <tr>
            <th>排名</th><th>代码</th><th>名称</th>
            <th class="num">最新价</th><th class="num">60日均成交额</th>
            <th>行业</th><th class="num">得分</th>
          </tr>
        </thead>
        <tbody id="lt-body"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
function n_(o, keys) {
  if (!o) return null;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return null;
}
function s_(o, keys, d) {
  if (!o) return d || "";
  for (const k of keys) {
    const v = o[k];
    if (v !== undefined && v !== null && v !== "") return String(v);
  }
  return d || "";
}

/* ---- 动量选股：三档强度标注 ---- */
function assignTier(list) {
  const n = list.length;
  const sorted = list.slice().sort((a, b) =>
    (n_(b, ["综合得分","score"]) ?? -1) - (n_(a, ["综合得分","score"]) ?? -1));
  const rankOf = new Map();
  sorted.forEach((s, i) => rankOf.set(s, i));
  return list.map(s => {
    const r = rankOf.get(s);
    let tier;
    if (r < n / 3) tier = { label: "重点关注", cls: "tag-warn" };
    else if (r < n * 2 / 3) tier = { label: "观察", cls: "tag-muted" };
    else tier = { label: "谨慎", cls: "tag-ok" };
    return { s, tier, rank: r };
  });
}
function momCard(item) {
  const { s, tier } = item;
  return `<div class="card mini">
    <div class="stock-head">
      <div><span class="stock-code">${esc(s_(s,["代码"]))}</span>
        <span class="stock-name">${esc(s_(s,["名称"]))}</span></div>
      <span class="tag ${tier.cls}">${tier.label}</span>
    </div>
    <div class="kv-list">
      <div class="kv-row"><span class="kv-key">最新价</span>
        <span class="kv-val num">${fmt.num(n_(s,["最新价"]),2)}</span></div>
      <div class="kv-row"><span class="kv-key">涨跌幅</span>
        <span class="kv-val num ${n_(s,["涨跌幅"])>0?"pos":"neg"}">${fmt.num(n_(s,["涨跌幅"]),2)}%</span></div>
      <div class="kv-row"><span class="kv-key">行业</span>
        <span class="kv-val">${esc(s_(s,["行业"],"未分类"))}</span></div>
    </div>
  </div>`;
}

/* ---- 60日策略：直接按得分取前20 ---- */
function ltRow(s, rank) {
  const amt = n_(s, ["core_amt"]);
  const score = n_(s, ["expect_bps","stock_score"]);
  return `<tr>
    <td class="num">${rank}</td>
    <td class="num">${esc(s_(s,["code","代码"]))}</td>
    <td>${esc(s_(s,["name","名称"]))}</td>
    <td class="num">${fmt.num(n_(s,["close"]),2)}</td>
    <td class="num">${amt!==null?fmt.num(amt/1e8,3)+" 亿":"—"}</td>
    <td>${esc(s.sector||"未分类")}</td>
    <td class="num">${score!==null?fmt.num(score,1):"—"}</td>
  </tr>`;
}

(async function () {
  buildChrome("signals.html");
  stampLastRun();

  const dual = await loadJson("dual.json");

  panel("动量选股", () => {
    const A = (dual && dual.momentum) || {};
    const stocks = A.stocks || [];
    const ranked = assignTier(stocks).sort((a,b)=>a.rank-b.rank);
    document.getElementById("mom-meta").textContent = ranked.length
      ? `${ranked.length} 只 · ${(dual && dual.update_date) || ""}` : "无";
    document.getElementById("mom-list").innerHTML = ranked.length
      ? `<div class="grid cols-3">${ranked.map(momCard).join("")}</div>`
      : emptyState("今日无候选", "");
  });

  panel("60日策略", () => {
    const B = (dual && dual.low_turnover) || {};
    const list = (B.buy || []).slice()
      .sort((a,b) => (n_(b,["expect_bps","stock_score"])??-1) - (n_(a,["expect_bps","stock_score"])??-1))
      .slice(0, 20);
    document.getElementById("lt-meta").textContent = list.length ? `${list.length} 只` : "无";
    document.getElementById("lt-body").innerHTML = list.length
      ? list.map((s,i)=>ltRow(s,i+1)).join("")
      : `<tr><td colspan="7">${emptyState("今日无候选", "")}</td></tr>`;
  });
})();
</script>

<style>
.card.mini { padding:12px 14px; margin-bottom:10px; }
.stock-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
.stock-code { font-variant-numeric:tabular-nums; font-weight:600; }
.stock-name { margin-left:6px; opacity:.8; }
.kv-row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; align-items:baseline; }
.kv-key { opacity:.7; flex-shrink:0; font-size:.9em; }
.kv-val.num { font-variant-numeric:tabular-nums; }
.kv-val.pos { color:var(--pos,#3d7a5a); }
.kv-val.neg { color:var(--neg,#b4483c); }
.table-wrap { overflow-x:auto; }
.tbl td.num, .tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</body>
</html>
