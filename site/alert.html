<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>启动前预警 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">启动前预警</h2>
  </div>

  <section class="grid cols-2" id="overview"></section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">严格版 · 连日≥5%</h3>
      <span class="section-meta" id="strict-meta">—</span>
    </div>
    <div id="strict-list"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">宽松版 · 3日累计≥10%</h3>
      <span class="section-meta" id="loose-meta">—</span>
    </div>
    <div id="loose-list"></div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
function n_(o, keys, d) {
  if (!o) return d === undefined ? null : d;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return d === undefined ? null : d;
}

function strictCard(s) {
  const status = s["状态"] || "";
  const cls = status.includes("已确认") ? "tag-warn" : "tag-muted";
  return `<div class="card mini">
    <div class="stock-head">
      <div><span class="stock-code">${esc(String(s["代码"]||""))}</span>
        <span class="stock-name">${esc(String(s["名称"]||""))}</span></div>
      <span class="tag ${cls}">${esc(status)}</span>
    </div>
    <div class="kv-list">
      <div class="kv-row"><span class="kv-key">最新价</span>
        <span class="kv-val num">${fmt.num(n_(s,["最新价"]),2)}</span></div>
      <div class="kv-row"><span class="kv-key">今日涨跌幅</span>
        <span class="kv-val num ${n_(s,["今日涨跌幅"])>0?"pos":"neg"}">${fmt.num(n_(s,["今日涨跌幅"]),2)}%</span></div>
      <div class="kv-row"><span class="kv-key">连续达标天数</span>
        <span class="kv-val num">${s["连续达标天数"]}</span></div>
      <div class="kv-row"><span class="kv-key">行业</span>
        <span class="kv-val">${esc(String(s["行业"]||"未分类"))}</span></div>
      <div class="kv-row"><span class="kv-key">同行业共现</span>
        <span class="kv-val num">${s["同行业共现数"]}</span></div>
    </div>
  </div>`;
}

function looseCard(s) {
  const tier = s["档位"] || "";
  const cls = tier.includes("强") ? "tag-warn" : "tag-muted";
  return `<div class="card mini">
    <div class="stock-head">
      <div><span class="stock-code">${esc(String(s["代码"]||""))}</span>
        <span class="stock-name">${esc(String(s["名称"]||""))}</span></div>
      <span class="tag ${cls}">${esc(tier)}</span>
    </div>
    <div class="kv-list">
      <div class="kv-row"><span class="kv-key">最新价</span>
        <span class="kv-val num">${fmt.num(n_(s,["最新价"]),2)}</span></div>
      <div class="kv-row"><span class="kv-key">3日累计涨幅</span>
        <span class="kv-val num pos">${fmt.num(n_(s,["3日累计涨幅"]),2)}%</span></div>
      <div class="kv-row"><span class="kv-key">行业</span>
        <span class="kv-val">${esc(String(s["行业"]||"未分类"))}</span></div>
      <div class="kv-row"><span class="kv-key">同行业共现</span>
        <span class="kv-val num">${s["同行业共现数"]}</span></div>
    </div>
  </div>`;
}

(async function () {
  buildChrome("alert.html");
  stampLastRun();

  const data = await loadJson("dual.json");
  const strict = (data && data.strict_5pct_watch) || {};
  const loose = (data && data.loose_cumulative_watch) || {};
  const sList = strict.watch || [];
  const lList = loose.watch || [];

  panel("概览", () => {
    document.getElementById("overview").innerHTML = `
      <div class="card"><h3 class="card-title">严格版</h3>
        <div class="big-num">${sList.length}<span class="unit"> 只</span></div>
        <div class="kv-list">
          <div class="kv-row"><span class="kv-key">已确认(3日)</span>
            <span class="kv-val num">${strict.meta?.confirmed_count ?? "—"}</span></div>
          <div class="kv-row"><span class="kv-key">观察(2日)</span>
            <span class="kv-val num">${strict.meta?.watching_count ?? "—"}</span></div>
        </div>
      </div>
      <div class="card"><h3 class="card-title">宽松版</h3>
        <div class="big-num">${lList.length}<span class="unit"> 只</span></div>
        <div class="kv-list">
          <div class="kv-row"><span class="kv-key">15%+</span>
            <span class="kv-val num">${loose.meta?.tier15_count ?? "—"}</span></div>
          <div class="kv-row"><span class="kv-key">10%+</span>
            <span class="kv-val num">${loose.meta?.tier10_count ?? "—"}</span></div>
        </div>
      </div>`;
  });

  panel("严格版列表", () => {
    document.getElementById("strict-meta").textContent = sList.length ? `${sList.length} 只` : "无";
    document.getElementById("strict-list").innerHTML = sList.length
      ? `<div class="grid cols-3">${sList.map(strictCard).join("")}</div>`
      : emptyState("当前无标的", "");
  });

  panel("宽松版列表", () => {
    document.getElementById("loose-meta").textContent = lList.length ? `${lList.length} 只` : "无";
    document.getElementById("loose-list").innerHTML = lList.length
      ? `<div class="grid cols-3">${lList.map(looseCard).join("")}</div>`
      : emptyState("当前无标的", "");
  });
})();
</script>

<style>
.big-num { font-size:1.9rem; font-variant-numeric:tabular-nums; line-height:1.15; }
.big-num .unit { font-size:.85rem; opacity:.6; margin-left:3px; }
.card.mini { padding:12px 14px; margin-bottom:10px; }
.stock-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
.stock-code { font-variant-numeric:tabular-nums; font-weight:600; }
.stock-name { margin-left:6px; opacity:.8; }
.kv-row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; align-items:baseline; }
.kv-key { opacity:.7; flex-shrink:0; font-size:.9em; }
.kv-val.num { font-variant-numeric:tabular-nums; }
.kv-val.pos { color:var(--pos,#3d7a5a); }
.kv-val.neg { color:var(--neg,#b4483c); }
</style>
</body>
</html>
