<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>涨幅预警 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">涨幅预警</h2>
  </div>

  <section class="grid cols-2" id="overview"></section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">强预警</h3>
      <span class="section-meta" id="strong-meta">—</span>
    </div>
    <div class="table-wrap">
      <table class="tbl" id="strong-table">
        <thead>
          <tr>
            <th>排名</th><th>代码</th><th>名称</th>
            <th class="num">最新价</th><th class="num">今日涨跌幅</th>
            <th class="num">近5日涨幅</th><th class="num">近20日波动率</th>
            <th class="num">近5日上涨天数</th><th class="num">量能倍数</th>
            <th>行业</th><th class="num">得分</th>
          </tr>
        </thead>
        <tbody id="strong-body"></tbody>
      </table>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">预警</h3>
      <span class="section-meta" id="normal-meta">—</span>
    </div>
    <div class="table-wrap">
      <table class="tbl" id="normal-table">
        <thead>
          <tr>
            <th>排名</th><th>代码</th><th>名称</th>
            <th class="num">最新价</th><th class="num">今日涨跌幅</th>
            <th class="num">近5日涨幅</th><th class="num">近20日波动率</th>
            <th class="num">近5日上涨天数</th><th class="num">量能倍数</th>
            <th>行业</th><th class="num">得分</th>
          </tr>
        </thead>
        <tbody id="normal-body"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
function n_(o, keys) {
  if (!o) return null;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return null;
}

function row(s, rank) {
  const chg = n_(s, ["今日涨跌幅"]);
  const ret5 = n_(s, ["近5日涨幅"]);
  const vol20 = n_(s, ["近20日波动率"]);
  const updays = s["近5日上涨天数"];
  const vspike = n_(s, ["量能倍数"]);
  const score = n_(s, ["综合得分"]);
  return `<tr>
    <td class="num">${rank}</td>
    <td class="num">${esc(String(s["代码"]||""))}</td>
    <td>${esc(String(s["名称"]||""))}</td>
    <td class="num">${fmt.num(n_(s,["最新价"]),2)}</td>
    <td class="num ${fmt.dirClass(chg)}">${fmt.num(chg,2)}%</td>
    <td class="num ${fmt.dirClass(ret5)}">${ret5!==null?fmt.num(ret5,2)+"%":"—"}</td>
    <td class="num">${vol20!==null?fmt.num(vol20,2)+"%":"—"}</td>
    <td class="num">${updays!==null&&updays!==undefined?updays:"—"}</td>
    <td class="num">${vspike!==null?fmt.num(vspike,2):"—"}</td>
    <td>${esc(String(s["行业"]||"未分类"))}</td>
    <td class="num">${score!==null?fmt.num(score,1):"—"}</td>
  </tr>`;
}

(async function () {
  buildChrome("alert.html");
  stampLastRun();

  const data = await loadJson("dual.json");
  const F = (data && data.precursor_factor_watch) || {};
  const all = F.watch || [];
  const strong = all.filter(s => s["档位"] === "强预警")
    .sort((a,b) => (n_(b,["综合得分"])??-1) - (n_(a,["综合得分"])??-1));
  const normal = all.filter(s => s["档位"] !== "强预警")
    .sort((a,b) => (n_(b,["综合得分"])??-1) - (n_(a,["综合得分"])??-1));

  panel("概览", () => {
    document.getElementById("overview").innerHTML = `
      <div class="card"><h3 class="card-title">强预警</h3>
        <div class="big-num">${strong.length}<span class="unit"> 只</span></div>
      </div>
      <div class="card"><h3 class="card-title">预警</h3>
        <div class="big-num">${normal.length}<span class="unit"> 只</span></div>
      </div>`;
  });

  panel("强预警列表", () => {
    document.getElementById("strong-meta").textContent = strong.length ? `${strong.length} 只 · ${(data&&data.update_date)||""}` : "无";
    document.getElementById("strong-body").innerHTML = strong.length
      ? strong.map((s,i) => row(s,i+1)).join("")
      : `<tr><td colspan="11">${emptyState("当前无标的", "")}</td></tr>`;
  });

  panel("预警列表", () => {
    document.getElementById("normal-meta").textContent = normal.length ? `${normal.length} 只` : "无";
    document.getElementById("normal-body").innerHTML = normal.length
      ? normal.map((s,i) => row(s,i+1)).join("")
      : `<tr><td colspan="11">${emptyState("当前无标的", "")}</td></tr>`;
  });
})();
</script>

<style>
.big-num { font-size:1.9rem; font-variant-numeric:tabular-nums; line-height:1.15; }
.big-num .unit { font-size:.85rem; opacity:.6; margin-left:3px; }
.table-wrap { overflow-x:auto; margin-bottom:24px; }
.tbl td.num, .tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
.tbl td.up { color:var(--up,#b4483c); }
.tbl td.down { color:var(--down,#3d7a5a); }
</style>
</body>
</html>
