<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>涨幅预警 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">涨幅预警</h2>
  </div>

  <section class="grid cols-2" id="overview"></section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">强预警</h3>
      <span class="section-meta" id="strong-meta">—</span>
    </div>
    <div id="strong-list"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">预警</h3>
      <span class="section-meta" id="normal-meta">—</span>
    </div>
    <div id="normal-list"></div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
function n_(o, keys) {
  if (!o) return null;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return null;
}

function card(s, rank) {
  const chg = n_(s, ["今日涨跌幅"]);
  const ret5 = n_(s, ["近5日涨幅"]);
  const vol20 = n_(s, ["近20日波动率"]);
  const updays = s["近5日上涨天数"];
  const vspike = n_(s, ["量能倍数"]);
  const score = n_(s, ["综合得分"]);
  return `<div class="card">
    <div class="stock-head">
      <div>
        <span class="stock-code">${esc(String(s["代码"]||""))}</span>
        <span class="stock-name">${esc(String(s["名称"]||""))}</span>
        <span class="stock-industry">${esc(String(s["行业"]||"未分类"))}</span>
      </div>
      <span class="tag tag-muted">${score!==null?fmt.num(score,1)+"分":"—"}</span>
    </div>
    <div class="kv-row">
      <span class="kv-key">排名 ${rank}</span>
      <span class="kv-val num ${fmt.dirClass(chg)}">${fmt.num(n_(s,["最新价"]),2)}　${chg>0?"+":""}${fmt.num(chg,2)}%</span>
    </div>
    <div class="kv-list">
      <div class="kv-row"><span class="kv-key">近5日涨幅</span>
        <span class="kv-val num ${fmt.dirClass(ret5)}">${ret5!==null?(ret5>0?"+":"")+fmt.num(ret5,2)+"%":"—"}</span></div>
      <div class="kv-row"><span class="kv-key">近20日波动率</span>
        <span class="kv-val num">${vol20!==null?fmt.num(vol20,2)+"%":"—"}</span></div>
      <div class="kv-row"><span class="kv-key">近5日上涨天数</span>
        <span class="kv-val num">${updays!==null&&updays!==undefined?updays:"—"}</span></div>
      <div class="kv-row"><span class="kv-key">量能倍数</span>
        <span class="kv-val num">${vspike!==null?fmt.num(vspike,2)+"x":"—"}</span></div>
    </div>
  </div>`;
}

(async function () {
  buildChrome("alert.html");
  stampLastRun();

  const data = await loadJson("dual.json");
  const F = (data && data.precursor_factor_watch) || {};
  const all = F.watch || [];
  const strong = all.filter(s => s["档位"] === "强预警")
    .sort((a,b) => (n_(b,["综合得分"])??-1) - (n_(a,["综合得分"])??-1));
  const normal = all.filter(s => s["档位"] !== "强预警")
    .sort((a,b) => (n_(b,["综合得分"])??-1) - (n_(a,["综合得分"])??-1));

  panel("概览", () => {
    document.getElementById("overview").innerHTML = `
      <div class="card"><h3 class="card-title">强预警</h3>
        <div class="big-num">${strong.length}<span class="unit"> 只</span></div>
      </div>
      <div class="card"><h3 class="card-title">预警</h3>
        <div class="big-num">${normal.length}<span class="unit"> 只</span></div>
      </div>`;
  });

  panel("强预警列表", () => {
    document.getElementById("strong-meta").textContent = strong.length ? `${strong.length} 只 · ${(data&&data.update_date)||""}` : "无";
    document.getElementById("strong-list").innerHTML = strong.length
      ? `<div class="grid cols-2">${strong.map((s,i) => card(s,i+1)).join("")}</div>`
      : emptyState("当前无标的", "");
  });

  panel("预警列表", () => {
    document.getElementById("normal-meta").textContent = normal.length ? `${normal.length} 只` : "无";
    document.getElementById("normal-list").innerHTML = normal.length
      ? `<div class="grid cols-2">${normal.map((s,i) => card(s,i+1)).join("")}</div>`
      : emptyState("当前无标的", "");
  });
})();
</script>

<style>
.big-num { font-size:1.9rem; font-variant-numeric:tabular-nums; line-height:1.15; }
.big-num .unit { font-size:.85rem; opacity:.6; margin-left:3px; }

.alert-grid { display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:640px) { .alert-grid { grid-template-columns:1fr 1fr; } }

.alert-card { border:1px solid var(--rule,#d8d4cc); border-radius:8px; padding:12px 14px; }
.alert-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.alert-rank { font-variant-numeric:tabular-nums; opacity:.5; font-size:.85em; }
.alert-score { font-variant-numeric:tabular-nums; opacity:.7; font-size:.85em; }

.alert-id-row { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.alert-code { font-variant-numeric:tabular-nums; font-weight:600; }
.alert-name { font-weight:600; }
.alert-industry { opacity:.6; font-size:.85em; }

.alert-price-row { display:flex; align-items:baseline; gap:10px; margin-bottom:8px;
  padding-bottom:8px; border-bottom:1px solid var(--rule,#d8d4cc); }
.alert-price { font-size:1.5rem; font-variant-numeric:tabular-nums; font-weight:600; }
.alert-chg { font-variant-numeric:tabular-nums; font-size:.95em; }
.alert-chg.up { color:var(--up,#b4483c); }
.alert-chg.down { color:var(--down,#3d7a5a); }

.alert-detail { display:flex; flex-wrap:wrap; gap:10px 14px; font-size:.85em; opacity:.85; }
.alert-detail b { font-variant-numeric:tabular-nums; font-weight:600; }
.alert-detail b.up { color:var(--up,#b4483c); }
.alert-detail b.down { color:var(--down,#3d7a5a); }
</style>
</body>
</html>
