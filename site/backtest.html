<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>策略回测 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">策略回测</h2>
    <p class="page-note">数据区间 2017-11 ~ 2026-07，2889 只主板股（含 197 只退市股），2112 个交易日。</p>
  </div>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">回测策略总结</h3>
      <span class="section-meta">通过样本外验证的配置</span>
    </div>
    <div class="card" id="summary"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">线上回测结果</h3>
      <span class="section-meta" id="live-meta">—</span>
    </div>
    <div id="live"></div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
const RULES = [
  "主板，剔除 ST / *ST",
  "剔除股价 &lt; 2 元",
  "剔除近 60 日日均成交额 &lt; 500 万",
  "取剩余股票中 <strong>60 日均成交额最低 20%</strong>",
  "<strong>等权持有 60 个交易日</strong>，到期换仓，中途不动",
  "每 15 个交易日开一批，4 个梯队滚动",
];

const METRICS = [
  ["样本内超额（2018-2022）", "+322 bps / 60天", "t = 8.19", "ok"],
  ["样本外超额（2023-2026）", "+160 bps / 60天", "t = 5.24", "ok"],
  ["期胜率（样本外）", "66%", "—", "ok"],
  ["持有期单调性", "20→40→60日：68 → 115 → 160 bps", "保持", "ok"],
  ["含退市股", "197 只已补入", "—", "ok"],
  ["分散度要求", "需 50 只以上持仓", "20 只时 t = 1.22", "warn"],
];

(async function () {
  buildChrome("backtest.html");
  stampLastRun();

  panel("总结", () => {
    const rules = RULES.map((r, i) =>
      `<div class="kv-row"><span class="kv-key">${i + 1}</span>
       <span class="kv-val">${r}</span></div>`).join("");
    const rows = METRICS.map(m =>
      `<tr><td>${esc(m[0])}</td><td class="num">${m[1]}</td>
       <td class="num">${esc(m[2])}</td>
       <td><span class="tag ${m[3] === "ok" ? "tag-ok" : "tag-warn"}">
         ${m[3] === "ok" ? "通过" : "注意"}</span></td></tr>`).join("");
    document.getElementById("summary").innerHTML = `
      <h3 class="card-title">规则</h3>
      <div class="kv-list">${rules}</div>
      <h3 class="card-title" style="margin-top:18px">验证结果</h3>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>检验</th><th class="num">数值</th>
          <th class="num">统计量</th><th>判定</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  });

  const data = await loadJson("backtest.json");
  if (!data) {
    document.getElementById("live").innerHTML =
      emptyState("尚无线上回测结果", "backtest.json 生成后会显示在这里");
    document.getElementById("live-meta").textContent = "未生成";
    return;
  }

  panel("线上回测", () => {
    const m = data.metrics || data;
    const pick = (...ks) => { for (const k of ks) if (m[k] !== undefined) return m[k]; return null; };
    const cards = [
      ["交易笔数", pick("n_trades", "交易次数", "完整交易笔数"), ""],
      ["单笔净收益", pick("mean_net_return_bps", "平均单笔收益率"), "bps"],
      ["t 统计量", pick("tstat", "t"), ""],
      ["胜率", pick("win_rate", "胜率"), ""],
      ["年化", pick("cagr", "年化"), ""],
      ["最大回撤", pick("max_drawdown", "最大回撤"), ""],
    ];
    document.getElementById("live-meta").textContent =
      data.label || data.strategy || "";
    document.getElementById("live").innerHTML =
      `<div class="grid cols-3">${cards.map(c =>
        `<div class="card"><h3 class="card-title">${esc(c[0])}</h3>
         <div class="big-num">
           ${c[1] === null ? "—" : (typeof c[1] === "number"
             ? fmt.num(c[1], 2) : esc(String(c[1])))}
           <span class="unit">${esc(c[2])}</span>
         </div></div>`).join("")}</div>
       <div class="card" style="margin-top:12px">
         <p class="page-note" style="margin:0">
           读数顺序：先看<strong>交易笔数</strong>（少于 300 笔后面都不用看），
           再看<strong>单笔净收益</strong>（不受资金曲线和仓位管理影响），
           最后才是年化和回撤。
         </p>
       </div>`;
  });
})();
</script>

<style>
.big-num { font-size:1.7rem; font-variant-numeric:tabular-nums; line-height:1.15; }
.big-num .unit { font-size:.85rem; opacity:.6; margin-left:3px; }
.tbl td.num, .tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
.kv-row { display:flex; gap:12px; padding:4px 0; align-items:baseline; }
.kv-key { opacity:.6; min-width:1.5em; flex-shrink:0; }
.kv-val { flex:1; }
.table-wrap { overflow-x:auto; }
</style>
</body>
</html>
