<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>持仓监控 · Trading Decision Terminal</title>
<link rel="stylesheet" href="./terminal.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Trading Decision Terminal
      <span class="wordmark-sub">交易决策终端</span>
    </h1>
    <div class="stamp" id="stamp">读取中…</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="页面导航"></nav>
</header>

<div class="diag" id="diag" hidden></div>

<main>
  <div class="page-head">
    <h2 class="page-title">持仓监控</h2>
  </div>

  <section class="grid cols-3" id="overview"></section>
  <section id="alerts"></section>

  <section class="section">
    <div class="section-head">
      <h3 class="section-title">持仓明细</h3>
      <span class="section-meta" id="hold-meta">—</span>
    </div>
    <div id="holdings"></div>
  </section>
</main>

<footer class="foot">个人自用工具，非投资建议。所有信号由量化规则生成，执行前请自行复核。</footer>

<script src="./terminal.js"></script>
<script>
const HOLD_DAYS = 60;

function n_(o, keys, d) {
  if (!o) return d === undefined ? null : d;
  for (const k of keys) {
    const v = o[k];
    if (typeof v === "number" && isFinite(v)) return v;
  }
  return d === undefined ? null : d;
}

function holdCard(h) {
  const days = n_(h, ["holding_days", "持有天数"], 0) || 0;
  const left = Math.max(0, HOLD_DAYS - days);
  const cost = n_(h, ["cost_price", "avg_cost", "成本价"]);
  const price = n_(h, ["last_price", "close", "现价"]);
  const pnl = (cost && price) ? (price / cost - 1) : n_(h, ["pnl_pct"]);
  const shares = n_(h, ["shares", "持股数"]);

  let action = h.next_action || h.pending_exit;
  if (!action) action = left <= 0 ? "到期卖出" : `继续持有（剩 ${left} 日）`;
  const urgent = left <= 3 || /卖出|清仓/.test(action);
  const pnlCls = pnl === null ? "" : fmt.dirClass(pnl);

  return `<div class="card">
    <div class="stock-head">
      <div><span class="stock-code">${esc(String(h.code || ""))}</span>
        <span class="stock-name">${esc(String(h.name || ""))}</span></div>
      <span class="tag ${urgent ? "tag-warn" : "tag-muted"}">${esc(action)}</span>
    </div>
    <div class="live-row">
      <div class="live-cell">
        <div class="live-label">现价</div>
        <div class="live-num">${price!==null?fmt.num(price,2):"—"}</div>
      </div>
      <div class="live-cell">
        <div class="live-label">盈亏率</div>
        <div class="live-num ${pnlCls}">${pnl!==null?(pnl>0?"+":"")+fmt.num(pnl*100,2)+"%":"—"}</div>
      </div>
    </div>
    ${meter("持有进度", days, HOLD_DAYS, `${days} / ${HOLD_DAYS} 日`)}
    <div class="kv-list" style="margin-top:10px">
      ${cost !== null ? `<div class="kv-row"><span class="kv-key">成本</span>
        <span class="kv-val num">${fmt.num(cost, 2)}</span></div>` : ""}
      ${shares !== null ? `<div class="kv-row"><span class="kv-key">持股</span>
        <span class="kv-val num">${fmt.num(shares, 0)}</span></div>` : ""}
      ${h.sector && h.sector !== "未分类" ? `<div class="kv-row"><span class="kv-key">行业</span>
        <span class="kv-val">${esc(h.sector)}</span></div>` : ""}
    </div>
  </div>`;
}

function alertBox(t) {
  return `<div class="card alert"><p style="margin:0">${t}</p></div>`;
}

(async function () {
  buildChrome("holdings.html");
  stampLastRun();

  const data = await loadJson("positions.json");
  const list = Array.isArray(data) ? data
    : (data && (data.holdings || data.positions)) || [];

  panel("概览", () => {
    const n = list.length;
    const totalPct = list.reduce((a, h) =>
      a + (n_(h, ["position_pct", "weight", "仓位"], 0) || 0), 0);
    const avgPnl = n ? list.reduce((a, h) => {
      const cost = n_(h, ["cost_price", "avg_cost", "成本价"]);
      const price = n_(h, ["last_price", "close", "现价"]);
      const pnl = (cost && price) ? (price / cost - 1) : (n_(h, ["pnl_pct"]) || 0);
      return a + pnl;
    }, 0) / n : null;
    const cards = [
      ["持仓只数", n, ""],
      ["合计仓位", n ? fmt.num(totalPct, 1) + "%" : "—", ""],
      ["平均盈亏率", avgPnl!==null ? (avgPnl>0?"+":"")+fmt.num(avgPnl*100,2)+"%" : "—",
        avgPnl===null?"":fmt.dirClass(avgPnl)],
    ];
    document.getElementById("overview").innerHTML = cards.map(c =>
      `<div class="card"><h3 class="card-title">${esc(c[0])}</h3>
       <div class="big-num ${c[2]}">${typeof c[1] === "number" ? c[1] : esc(String(c[1]))}</div>
      </div>`).join("");
  });

  panel("警示", () => {
    const box = [];
    if (list.length && list.length < 30) {
      box.push(alertBox(`当前持仓 <strong>${list.length}</strong> 只，分散度不足。`));
    }
    if (!list.length) {
      box.push(alertBox(`当前空仓。`));
    }
    document.getElementById("alerts").innerHTML = box.join("");
  });

  panel("持仓明细", () => {
    document.getElementById("hold-meta").textContent =
      list.length ? `${list.length} 只` : "无";
    document.getElementById("holdings").innerHTML = list.length
      ? `<div class="grid cols-2">${list.map(holdCard).join("")}</div>`
      : emptyState("当前无持仓", "");
  });
})();
</script>

<style>
.big-num { font-size:1.9rem; font-variant-numeric:tabular-nums; line-height:1.15; }
.big-num.up { color:var(--up,#b4483c); }
.big-num.down { color:var(--down,#3d7a5a); }
.stock-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px; }
.stock-code { font-variant-numeric:tabular-nums; font-weight:600; }
.stock-name { margin-left:8px; opacity:.8; }
.live-row { display:flex; gap:16px; margin-bottom:12px; padding:10px 0;
  border-top:1px solid var(--rule,#d8d4cc); border-bottom:1px solid var(--rule,#d8d4cc); }
.live-cell { flex:1; }
.live-label { font-size:.8em; opacity:.6; margin-bottom:2px; }
.live-num { font-size:1.6rem; font-variant-numeric:tabular-nums; font-weight:600; }
.live-num.up { color:var(--up,#b4483c); }
.live-num.down { color:var(--down,#3d7a5a); }
.kv-row { display:flex; justify-content:space-between; gap:12px; padding:3px 0; align-items:baseline; }
.kv-key { opacity:.7; flex-shrink:0; font-size:.92em; }
.kv-val.num { font-variant-numeric:tabular-nums; }
.alert { border-left:3px solid var(--warn,#b8862a); }
</style>
</body>
</html>
